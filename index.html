<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c2410c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="cookbook">
  <title>cookbook</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ───────── Lock screen (only on the first connexion of a device) ───────── -->
<section id="lock" class="screen" hidden>
  <form id="lock-form" class="card-form">
    <h1>🍳 cookbook</h1>
    <p class="muted">Enter the password to unlock.</p>
    <input id="lock-pass" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit" class="primary">Unlock</button>
    <p id="lock-error" class="error" role="alert"></p>
  </form>
</section>

<!-- ───────── One-time setup (when the repo has no config.json yet) ───────── -->
<section id="setup" class="screen" hidden>
  <form id="setup-form" class="card-form">
    <h1>🍳 cookbook</h1>
    <p class="muted">First-time setup. This is done once, from any device.</p>

    <label>GitHub repository
      <input id="s-repo" placeholder="your-name/cookbook" required autocapitalize="off" autocorrect="off" spellcheck="false">
    </label>

    <label>GitHub token
      <input id="s-token" type="password" placeholder="github_pat_…" required autocomplete="off">
      <small>
        Fine-grained token limited to this repository, permission <b>Contents: Read and write</b>.
        <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Create one</a>.
      </small>
    </label>

    <label>Choose a password
      <input id="s-pass" type="password" minlength="8" placeholder="At least 8 characters" required autocomplete="new-password">
    </label>
    <label>Confirm the password
      <input id="s-pass2" type="password" minlength="8" required autocomplete="new-password">
    </label>

    <button type="submit" class="primary">Create my cookbook</button>
    <p id="setup-error" class="error" role="alert"></p>
  </form>
</section>

<!-- ───────── App ───────── -->
<div id="app" hidden>
  <header>
    <h1>🍳 cookbook</h1>
    <nav>
      <button class="tab active" data-tab="gallery">Gallery</button>
      <button class="tab" data-tab="create">+ New</button>
    </nav>
    <button id="lock-btn" class="icon-btn" title="Lock this device" aria-label="Lock this device">🔒</button>
  </header>

  <main>
    <!-- Gallery -->
    <section id="tab-gallery">
      <input id="search" type="search" placeholder="Search a title or ingredients…" autocomplete="off">
      <div class="chips" role="group" aria-label="Search in">
        <button class="chip active" data-mode="all">All</button>
        <button class="chip" data-mode="title">Title</button>
        <button class="chip" data-mode="ingredients">Ingredients</button>
      </div>
      <p id="status" class="muted" role="status"></p>
      <div id="grid"></div>
    </section>

    <!-- Creation -->
    <section id="tab-create" hidden>
      <form id="create-form">
        <label>Title
          <input id="f-title" required maxlength="100" placeholder="Chocolate cake">
        </label>
        <label>Picture
          <input id="f-image" type="file" accept="image/*">
        </label>
        <img id="preview" alt="Preview" hidden>
        <label>Ingredients <small>(one per line)</small>
          <textarea id="f-ingredients" rows="6" required placeholder="200 g flour&#10;3 eggs&#10;100 g sugar"></textarea>
        </label>
        <label>Steps <small>(one per line)</small>
          <textarea id="f-steps" rows="8" required placeholder="Preheat the oven to 180°C&#10;Mix the dry ingredients&#10;…"></textarea>
        </label>
        <button type="submit" id="save-btn" class="primary">Save recipe</button>
        <p id="create-msg" class="muted" role="status"></p>
      </form>
    </section>
  </main>
</div>

<!-- Recipe detail -->
<dialog id="detail">
  <article>
    <button id="close-detail" class="close" aria-label="Close">✕</button>
    <img id="d-img" alt="" hidden>
    <div class="d-body">
      <h2 id="d-title"></h2>
      <h3>Ingredients</h3>
      <ul id="d-ingredients"></ul>
      <h3>Steps</h3>
      <ol id="d-steps"></ol>
      <button id="delete-btn" class="danger">Delete this recipe</button>
    </div>
  </article>
</dialog>

<script src="app.js"></script>
</body>
</html>
